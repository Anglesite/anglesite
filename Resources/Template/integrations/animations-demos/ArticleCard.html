<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Article card</title>
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;
font-family:-apple-system,system-ui,sans-serif;background:Canvas;color:CanvasText;color-scheme:light dark}</style>
<style>
  /* ✅ CRITERION 7: CSS-FIRST */

  [data-ac] {
    width: min(20rem, 100%);

    overflow: hidden;

    border: 1px solid #e5e7eb;
    border-radius: 0.75rem;

    background: white;

    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Arial,
      sans-serif;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

    box-shadow:
      0 1px 2px rgba(0,0,0,0.05);

    transition:
      transform 250ms ease,
      box-shadow 250ms ease;
  }

  [data-ac]:hover {
    transform: translateY(-4px);

    box-shadow:
      0 12px 24px rgba(0,0,0,0.08);
  }

  .media {
    width: 100%;
    height: 150px;

    background:
      linear-gradient(
        135deg,
        rgb(239,205,255),
        rgb(220,180,255)
      );

    overflow: hidden;
  }

  .media img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
  }

  .content {
    padding: 1.1rem;
  }

  .title-link {
    text-decoration: none;
  }

  .title {
    color: #111827;

    font-size: 1.125rem;
    line-height: 1.5rem;
    font-weight: 600;

    letter-spacing: -0.03em;
  }

  .description {
    margin-top: 0.65rem;

    color: #6b7280;

    font-size: 0.92rem;
    line-height: 1.65;
  }

  .action {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;

    margin-top: 1rem;
    padding: 0.45rem 0.75rem;

    border-radius: 0.45rem;

    background: #2563eb;
    color: white;

    font-size: 0.875rem;
    font-weight: 500;

    text-decoration: none;

    transition:
      background-color 200ms ease,
      transform 200ms ease;
  }

  .action:hover,
  .action:focus-visible {
    background: #1d4ed8;
  }

  .arrow {
    transition: transform 300ms ease;
  }

  .action:hover .arrow,
  .action:focus-visible .arrow {
    transform: translateX(4px);
  }

  /* Accessibility */
  .title-link:focus-visible,
  .action:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 4px;
  }

  /* ✅ CRITERION 6: REDUCED MOTION */
  @media (prefers-reduced-motion: reduce) {
    [data-ac],
    [data-ac] * {
      transition: none !important;
      transform: none !important;
    }
  }
</style>
</head><body>
<article data-ac class data-astro-cid-hxvelkko><div class="media" data-astro-cid-hxvelkko></div><div class="content" data-astro-cid-hxvelkko><a href="#" class="title-link" data-astro-cid-hxvelkko><span class="title" data-astro-cid-hxvelkko>Article title</span></a><p class="description" data-astro-cid-hxvelkko>A short summary of the article.</p><a class="action" href="#" data-astro-cid-hxvelkko>Find out more<span class="arrow" aria-hidden="true" data-astro-cid-hxvelkko>→</span></a></div></article>
</body></html>
