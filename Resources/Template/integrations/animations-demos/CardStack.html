<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Card stack</title>
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;
font-family:-apple-system,system-ui,sans-serif;background:Canvas;color:CanvasText;color-scheme:light dark}</style>
<style>
  /**
   * ✅ CRITERION 7: CSS-First
   * Stack layout is defined in CSS using nth-last-child.
   */
  .astro-card-stack-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 320px;
    margin: 4rem auto;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
  }

  .stack-card {
    position: absolute;
    width: 100%;
    height: 260px;
    padding: 1.5rem 2rem;
    background: #ffffff;
    color: #1a1a1a;
    border-radius: 32px;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.05),
      0 10px 30px -10px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(0, 0, 0, 0.05);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    cursor: grab;
    transform-origin: center bottom;
    will-change: transform, opacity;
    user-select: none;
    touch-action: none;
    transition:
      transform 0.6s cubic-bezier(0.23, 1, 0.32, 1),
      opacity 0.6s ease;
  }

  /**
   * ✅ CRITERION 6: Reduced Motion Respected
   */
  @media (prefers-reduced-motion: reduce) {
    .stack-card {
      transition: none !important;
    }
  }

  @media (prefers-color-scheme: dark) {
    .stack-card {
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
  }

  .stack-card:nth-last-child(1) {
    z-index: 3;
    transform: translate3d(0, 0, 0);
  }
  .stack-card:nth-last-child(2) {
    z-index: 2;
    transform: translate3d(0, 15px, -30px) scale(0.94);
    opacity: 0.8;
  }
  .stack-card:nth-last-child(3) {
    z-index: 1;
    transform: translate3d(0, 30px, -60px) scale(0.88);
    opacity: 0.4;
  }
  .stack-card:nth-last-child(n + 4) {
    opacity: 0;
    transform: translate3d(0, 45px, -90px) scale(0.82);
  }

  .stack-card.dragging {
    cursor: grabbing;
    transition: none;
    z-index: 50;
  }

  .quote-icon {
    width: 32px;
    opacity: 0.1;
    margin-bottom: 1.5rem;
    color: #6366f1;
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    color: inherit;
  }

  .quote {
    font-size: 1rem;
    line-height: 1.6;
    font-weight: 400;
    color: inherit;
    overflow-y: auto;
    max-height: 80px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .quote::-webkit-scrollbar {
    display: none;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding-top: 1.5rem;
    margin-top: auto;
    border-top: 1px solid rgba(0, 0, 0, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    .card-footer {
      border-top-color: rgba(255, 255, 255, 0.05);
    }
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 14px;
  }

  .avatar-img {
    object-fit: cover;
  }

  .info {
    display: flex;
    flex-direction: column;
  }

  .name {
    font-weight: 700;
    font-size: 1rem;
  }

  .role {
    font-size: 0.8rem;
    opacity: 0.5;
  }
</style>
</head><body>
